name: Validate Release Manifests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ajv-cli for schema validation
        run: npm install -g ajv-cli ajv-formats

      - name: Validate all manifests against schema
        run: |
          for file in manifests/*.json; do
            echo "Validating $file..."
            ajv validate -s schemas/release-manifest.schema.json -d "$file" -c ajv-formats
          done
